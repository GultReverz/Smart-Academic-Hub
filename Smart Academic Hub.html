<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Smart Academic Hub — Stop searching. Start studying.</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#f6f6f3;--card:#fff;--ink:#0f1b2d;--mut:#5b6676;--line:#e4e4de;--navy:#0f1b2d;--y:#f5b82e;--b:#2563eb;--g:#16a34a;--p:#7c3aed}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b121e;--card:#141d2c;--ink:#eef1f6;--mut:#9aa6b8;--line:#243044}}
:root[data-theme="dark"]{--bg:#0b121e;--card:#141d2c;--ink:#eef1f6;--mut:#9aa6b8;--line:#243044}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
a{color:inherit;text-decoration:none}h1,h2,h3,h4{margin:0;line-height:1.15;letter-spacing:-.02em}p{margin:0}
.w{max-width:1120px;margin:0 auto;padding:0 18px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:18px;height:62px}.logo{display:flex;align-items:center;gap:9px;font-weight:800;cursor:pointer}
.logo i{width:30px;height:30px;border-radius:9px;background:var(--navy);color:var(--y);display:grid;place-items:center;font-style:normal}
.logo small{display:block;font-weight:500;font-size:10px;color:var(--mut);letter-spacing:.08em}
.links{display:flex;gap:4px;margin-left:18px}.links a{padding:7px 12px;border-radius:8px;color:var(--mut);font-weight:500}.links a:hover,.links a.on{color:var(--ink);background:var(--line)}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 14px inherit;cursor:pointer;transition:.15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 14px #0001}.btn.pr{background:var(--navy);color:#fff;border-color:var(--navy)}.btn.ye{background:var(--y);color:#1a1300;border-color:var(--y)}.btn.wa{background:#22c55e;color:#04210f;border-color:#22c55e}.btn.sm{min-height:36px;padding:0 12px}
.bn{display:none;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.bn a{flex:1;text-align:center;font-size:11px;color:var(--mut);min-height:48px;display:flex;flex-direction:column;justify-content:center}.bn a b{font-size:18px;line-height:1.1}.bn a.on{color:var(--b);font-weight:700}
.hero{padding:56px 0 32px;display:grid;grid-template-columns:1.05fr 1fr;gap:36px;align-items:center}
.hero h1{font-size:clamp(36px,6vw,62px);font-weight:800}.hero h1 span{background:linear-gradient(transparent 62%,var(--y) 62%)}
.lead{font-size:18px;color:var(--mut);margin:16px 0 22px;max-width:520px}.row{display:flex;gap:10px;flex-wrap:wrap}
.pill{display:inline-block;padding:4px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:12px;font-weight:600;margin-bottom:14px}
.mock{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 20px 50px #0f1b2d22}
.mock .bar{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--mut);font-size:13px;margin-bottom:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
section{padding:44px 0}h2{font-size:clamp(26px,4vw,38px);font-weight:800}.sub{color:var(--mut);margin:8px 0 22px;max-width:620px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;transition:.15s}
[data-go]{cursor:pointer}[data-go]:hover{border-color:var(--b);box-shadow:0 6px 20px #0f1b2d14}
.ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:19px;margin-bottom:10px;background:var(--line)}
.card h4{font-size:16px;margin-bottom:4px}.card p{color:var(--mut);font-size:13.5px}
.dark{background:var(--navy);color:#fff;border-radius:22px;padding:34px 24px;text-align:center}.dark p{color:#c3cbd9;margin:8px auto 18px;max-width:520px}
.bd{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;margin-bottom:8px}
.t-Notes{background:#2563eb22;color:var(--b)}.t-Lecture{background:#16a34a22;color:var(--g)}.t-PYQ{background:#f5b82e33;color:#a16207}.t-Assignment{background:#7c3aed22;color:var(--p)}
.rc{position:relative}.bmb{position:absolute;right:10px;top:10px;border:0;background:none;font-size:20px;cursor:pointer;color:var(--y);min-width:36px;min-height:36px}
.crumb{font-size:13px;color:var(--mut);margin:20px 0 10px}.crumb a:hover{color:var(--b)}
.inp{width:100%;min-height:46px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.fb{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}.fb select{min-height:40px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);padding:0 10px;font:inherit}
.chip{display:inline-block;padding:6px 12px;border:1px solid var(--line);border-radius:99px;background:var(--card);font-size:13px;cursor:pointer;margin:0 6px 6px 0}.chip:hover{border-color:var(--b)}
.prog{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:10px}.prog i{display:block;height:100%}
.price{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:760px;margin:0 auto}.price .big{font-size:46px;font-weight:800}.price ul{padding-left:18px;color:var(--mut);margin:12px 0 18px}.price .feat{border:2px solid var(--y);position:relative}
.auth{max-width:420px;margin:40px auto}.auth label{display:block;font-weight:600;font-size:13px;margin:12px 0 5px}
.hd{display:flex;justify-content:space-between;align-items:end;gap:10px;margin-bottom:14px}
.empty{text-align:center;padding:40px 10px;color:var(--mut);border:1px dashed var(--line);border-radius:14px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.meta span{font-size:13px;background:var(--line);padding:4px 10px;border-radius:8px}
footer{border-top:1px solid var(--line);padding:30px 0;color:var(--mut);font-size:13px;margin-top:30px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;z-index:50;opacity:0;pointer-events:none;transition:.2s;max-width:90%}#toast.on{opacity:1}
@media(max-width:820px){.hero{grid-template-columns:1fr;padding-top:30px}.links{display:none}.bn{display:flex}.price{grid-template-columns:1fr}.hide-m{display:none}}
</style></head><body>
<header><div class="w nav"><div class="logo" data-go="/"><i>◆</i><div>Smart Academic Hub<small>FIND · LEARN · GROW</small></div></div>
<nav class="links" id="links"></nav><div class="sp"></div><div class="row" id="auth"></div></div></header>
<main class="w" id="app"></main>
<footer><div class="w row" style="justify-content:space-between"><span>© 2026 Smart Academic Hub · Find · Learn · Grow · Demo with sample data</span><span>Launching via WhatsApp communities</span></div></footer>
<nav class="bn" id="bn"></nav><div id="toast"></div>
<script>
const WA='https://wa.me/'; // replace with your WhatsApp group invite link
const $=s=>document.querySelector(s),ls=k=>{try{return localStorage.getItem('sah_'+k)}catch(e){return null}},sv=(k,v)=>{try{localStorage.setItem('sah_'+k,v)}catch(e){}};
const SUB=[['py','Programming in Python',1,'#2563eb','🐍',['Functions','Lists & Dictionaries','File Handling']],['dm','Discrete Mathematics',1,'#7c3aed','∑',['Relations & Functions','Graph Theory','Propositional Logic']],['ca','Computer System Architecture',1,'#0891b2','🖥',['CPU Organization','Digital Logic','Memory Hierarchy']],['ds','Data Structures',1,'#16a34a','🌳',['Arrays','Linked Lists','Stacks','Queues','Trees','Graphs','Sorting','Searching','Hashing']],['em','Engineering Mathematics',1,'#d97706','∫',['Calculus','Matrices','Differential Equations']],['oop','Object-Oriented Programming',2,'#db2777','◧',['Inheritance','Polymorphism','Exception Handling']],['db','Database Management Systems',2,'#0d9488','🗄',['SQL Joins','Normalization','Transactions']],['os','Operating Systems',2,'#dc2626','⚙',['Process Scheduling','Deadlocks','Memory Management']],['cn','Computer Networks',2,'#4f46e5','🌐',['OSI Model','TCP/IP','Routing']],['wd','Web Development',2,'#ca8a04','</>',['HTML & CSS','JavaScript Basics','React Fundamentals']]].map(a=>({id:a[0],name:a[1],sem:a[2],c:a[3],ic:a[4],tp:a[5]}));
const sub=id=>SUB.find(s=>s.id==id);const R=[];
const add=(s,t,type,title,year,d)=>{const S=sub(s),tp=S.tp[t];R.push({id:'r'+R.length,s,t,topic:tp,type,title,year,sem:S.sem,desc:d||`${type==='PYQ'?'Exam questions':type==='Lecture'?'A clear video walkthrough':type==='Assignment'?'Practice questions with reference material':'Concise, exam-focused notes'} on ${tp} for ${S.name}.`,tags:[tp.toLowerCase(),S.name.toLowerCase(),type.toLowerCase()],hay:(title+' '+tp+' '+S.name+' '+type+' '+year).toLowerCase()})};
add('ds',4,'Notes','Binary Trees — Complete Notes',2025,'Definitions, traversals, BST operations and solved examples for binary trees.');
add('ds',4,'Lecture','Binary Trees Explained',2025,'Step-by-step lecture on binary tree structure and traversal.');
add('ds',4,'PYQ','Binary Trees — 2024 PYQs',2024,'Previous-year questions on binary trees from the 2024 end-semester exam.');
add('ds',4,'Assignment','Tree Traversal Assignment',2025,'Inorder, preorder and postorder problems with a reference sheet.');
add('ds',4,'Assignment','Binary Search Tree Assignment',2025,'Insertion, deletion and search problems on BSTs.');
SUB.forEach(S=>S.tp.forEach((t,i)=>{add(S.id,i,'Notes',t+' — Lecture Notes',2025);add(S.id,i,'Lecture',t+' Explained',2024+i%2);if(i%2==0)add(S.id,i,'PYQ',`${t} — ${2022+i%3} PYQs`,2022+i%3);if(i%3==0)add(S.id,i,'Assignment',t+' Practice Assignment',2025)}));
const TY=['Notes','Lecture','PYQ','Assignment'],TI={Notes:'📝',Lecture:'▶️',PYQ:'❓',Assignment:'📋'};
let bm=new Set(JSON.parse(ls('bm')||'["r0","r5","r30"]')),user=JSON.parse(ls('user')||'null'),F={},plus=ls('plus')=='1';
const toast=m=>{const t=$('#toast');t.textContent=m;t.className='on';clearTimeout(t.h);t.h=setTimeout(()=>t.className='',2400)};
const go=h=>{location.hash='#'+h},rid=id=>R.find(r=>r.id==id);
const bd=t=>`<span class="bd t-${t}">${t}</span>`;
const rc=r=>`<div class="card rc" data-go="/resource/${r.id}">${bd(r.type)}<button class="bmb" data-bm="${r.id}" aria-label="Bookmark">${bm.has(r.id)?'★':'☆'}</button><h4 style="padding-right:30px">${r.title}</h4><p>${sub(r.s).name} · ${r.topic} · Sem ${r.sem} · ${r.year}</p></div>`;
const sc=s=>`<div class="card" data-go="/subject/${s.id}" style="border-top:4px solid ${s.c}"><div class="ic" style="background:${s.c}22;color:${s.c}">${s.ic}</div><h4>${s.name}</h4><p>Semester ${s.sem} · ${s.tp.length} topics · ${R.filter(r=>r.s==s.id).length} resources</p></div>`;
const crumb=a=>`<div class="crumb">${a.map(x=>x[1]?`<a href="#${x[1]}">${x[0]}</a>`:x[0]).join(' › ')}</div>`;
const chips=()=>['Binary Trees','Python Functions','Digital Logic','Calculus','Operating Systems'].map(c=>`<span class="chip" data-go="/search/${encodeURIComponent(c)}">${c}</span>`).join('');
const wa=`<a class="btn wa" href="${WA}" target="_blank" rel="noopener">💬 Join on WhatsApp</a>`;
const V={};
V.home=()=>`<div class="hero"><div><span class="pill">🎓 Built for BTech / CSE students</span><h1>Stop searching. <span>Start studying.</span></h1><p class="lead">Your notes, lectures, assignments, books and previous-year questions — organized in one place.</p><div class="row"><button class="btn pr" data-go="/resources">Explore Resources</button><button class="btn" data-go="/signup">Get Started</button></div></div>
<div class="mock"><div class="bar">🔍 Search notes, topics, PYQs, assignments…</div><div class="g2">${SUB.slice(3,7).map(s=>`<div class="card" style="padding:10px;border-top:3px solid ${s.c}"><b style="font-size:13px">${s.name}</b></div>`).join('')}</div><p style="font-size:12px;color:var(--mut);margin:12px 0 6px">RECENT RESOURCES</p>${R.slice(0,4).map(r=>`<div class="card" style="padding:9px 12px;margin-bottom:6px;display:flex;gap:8px;align-items:center">${bd(r.type).replace('class="bd','style="margin:0" class="bd')}<span style="font-size:13px">${r.title}</span></div>`).join('')}</div></div>
<section><h2>Your study material shouldn't be scattered everywhere.</h2><p class="sub">Right now, finding one PDF can take longer than reading it.</p><div class="grid">${[['💬','WhatsApp','Important PDFs disappear inside hundreds of messages.'],['📁','Google Drive','Files become difficult to organize across multiple folders.'],['👥','Different Groups','Every subject may have different groups and sources.'],['⏰','Exam Time','Students waste valuable time searching instead of studying.']].map(a=>`<div class="card"><div class="ic">${a[0]}</div><h4>${a[1]}</h4><p>${a[2]}</p></div>`).join('')}</div><h3 style="margin-top:28px;font-size:24px">Smart Academic Hub brings everything together.</h3></section>
<section><h2>Everything a student needs, one search away</h2><p class="sub">Save time, reduce exam-time stress, and study smarter.</p><div class="card" style="margin-bottom:14px"><h4>🔍 Smart Search — try it</h4><p style="margin:6px 0 10px">Type a topic and get notes, lectures, PYQs and assignments together.</p><input class="inp" id="hs" placeholder="Try “Binary Trees”"><div style="margin-top:10px">${chips()}</div></div><div class="grid">${[['🗂','Organized Library','Semester → Subject → Topic → Resource Type'],['❓','Previous-Year Questions','Find PYQs by subject, year, topic and exam.'],['📝','Notes & Lectures','Class notes, PDFs, lecture links and study guides.'],['📋','Assignments','Questions and reference material, together.'],['⭐','Bookmarks','Save important resources for later.'],['📱','Cross-Device','Works on laptop, tablet and mobile.']].map(a=>`<div class="card"><div class="ic">${a[0]}</div><h4>${a[1]}</h4><p>${a[2]}</p></div>`).join('')}</div></section>
<section><div class="hd"><h2>Browse by subject</h2><a class="btn sm" href="#/subjects">All subjects</a></div><div class="grid">${SUB.slice(0,6).map(sc).join('')}</div></section>
<section><div class="dark"><h2>Find your study material faster.</h2><p>Launching first in WhatsApp communities — join to get early access and request resources.</p><div class="row" style="justify-content:center"><button class="btn ye" data-go="/dashboard">Explore Smart Academic Hub</button>${wa}</div></div></section>`;
V.subjects=()=>`${crumb([['Home','/'],['Subjects']])}<h2>Subjects</h2><p class="sub">Pick a subject to see topics, notes, lectures, assignments and PYQs.</p>${[1,2].map(n=>`<h3 style="margin:18px 0 12px">Semester ${n}</h3><div class="grid">${SUB.filter(s=>s.sem==n).map(sc).join('')}</div>`).join('')}`;
V.subject=id=>{const s=sub(id);if(!s)return V.nf();const rs=R.filter(r=>r.s==id);return`${crumb([['Home','/'],['Subjects','/subjects'],[s.name]])}<div class="card" style="border-left:6px solid ${s.c}"><h2>${s.name}</h2><p class="sub" style="margin-bottom:8px">Learn fundamental concepts through organized notes, lectures, assignments and previous-year questions.</p><div class="meta"><span>Semester ${s.sem}</span><span>${s.tp.length} topics</span>${TY.map(t=>`<span>${rs.filter(r=>r.type==t).length} ${t}</span>`).join('')}</div></div>
<h3 style="margin:26px 0 12px">Topics</h3><div class="grid">${s.tp.map((t,i)=>`<div class="card" data-go="/topic/${id}/${i}"><h4>${t}</h4><p>${rs.filter(r=>r.t==i).length} resources</p></div>`).join('')}</div>
<h3 style="margin:26px 0 12px">Recent uploads</h3><div class="grid">${rs.slice(0,6).map(rc).join('')}</div><h3 style="margin:26px 0 12px">Previous-year questions</h3><div class="grid">${rs.filter(r=>r.type=='PYQ').map(rc).join('')}</div>`};
V.topic=(id,i)=>{const s=sub(id),t=s&&s.tp[i];if(!t)return V.nf();return`${crumb([['Home','/'],[s.name,'/subject/'+id],[t]])}<h2>${t}</h2><p class="sub">All resources for ${t}, grouped by type.</p>${TY.map(ty=>{const l=R.filter(r=>r.s==id&&r.t==i&&r.type==ty);return l.length?`<h3 style="margin:18px 0 12px">${TI[ty]} ${ty}</h3><div class="grid">${l.map(rc).join('')}</div>`:''}).join('')}`};
V.resource=id=>{const r=rid(id);if(!r)return V.nf();const s=sub(r.s),rel=R.filter(x=>x.s==r.s&&x.t==r.t&&x.id!=r.id);return`${crumb([['Home','/'],[s.name,'/subject/'+r.s],[r.topic,`/topic/${r.s}/${r.t}`],[r.title]])}<div class="card">${bd(r.type)}<h2>${r.title}</h2><p class="sub" style="margin-bottom:0">${r.desc}</p><div class="meta"><span>Subject: ${s.name}</span><span>Topic: ${r.topic}</span><span>Type: ${r.type}</span><span>Semester: ${r.sem}</span><span>Year: ${r.year}</span></div><div class="row"><button class="btn pr" data-act="open">Open Resource</button><button class="btn" data-act="dl">Download</button><button class="btn ye" data-bm="${r.id}">${bm.has(r.id)?'★ Bookmarked':'☆ Bookmark'}</button></div><p style="margin-top:12px;font-size:12px;color:var(--mut)">Tags: ${r.tags.join(' · ')}</p></div><h3 style="margin:26px 0 12px">Related resources</h3>${rel.length?`<div class="grid">${rel.map(rc).join('')}</div>`:'<div class="empty">No related resources yet.</div>'}`};
function res(q){const k=q.toLowerCase().split(/\s+/).filter(Boolean);return R.filter(r=>(!F.s||r.s==F.s)&&(!F.sem||r.sem==F.sem)&&(!F.ty||r.type==F.ty)&&(!F.y||r.year==F.y)&&(!F.tp||r.topic==F.tp)&&k.every(t=>r.hay.includes(t)))}
function paint(q){const l=res(q),el=$('#res');if(!el)return;el.innerHTML=l.length?`<p class="sub" style="margin:0 0 10px">${l.length} result${l.length>1?'s':''}${q?` for “${q}”`:''}</p>`+TY.map(t=>{const x=l.filter(r=>r.type==t);return x.length?`<h3 style="margin:18px 0 12px">${TI[t]} ${t}s</h3><div class="grid">${x.map(rc).join('')}</div>`:''}).join(''):`<div class="empty"><b>No matches</b><br>Try a different keyword or clear the filters.<div style="margin-top:12px">${chips()}</div></div>`}
V.search=q=>{q=q||'';const o=(k,l,a)=>`<select data-f="${k}"><option value="">${l}</option>${a.map(x=>`<option value="${x[0]}" ${F[k]==x[0]?'selected':''}>${x[1]}</option>`).join('')}</select>`;
return`${crumb([['Home','/'],[q?'Search':'Resources']])}<h2>${q?'Search results':'Resources'}</h2><p class="sub">Search across every subject, topic and resource type.</p><input class="inp" id="sq" value="${q.replace(/"/g,'&quot;')}" placeholder="Search notes, topics, PYQs, assignments..." autofocus><div class="fb">${o('s','Subject',SUB.map(s=>[s.id,s.name]))}${o('sem','Semester',[[1,'Semester 1'],[2,'Semester 2']])}${o('ty','Type',TY.map(t=>[t,t]))}${o('tp','Topic',[...new Set(R.map(r=>r.topic))].map(t=>[t,t]))}${o('y','Year',[2025,2024,2023,2022].map(y=>[y,y]))}<button class="btn sm" data-act="clr">Clear</button></div><div id="res"></div>`};
V.bookmarks=()=>{const l=[...bm].map(rid).filter(Boolean);return`${crumb([['Home','/'],['Bookmarks']])}<h2>Your Saved Resources</h2><p class="sub">${plus?'Unlimited bookmarks with Student Plus.':'Free plan: up to 10 bookmarks.'}</p>${l.length?`<div class="grid">${l.map(r=>`<div class="card">${rc(r).replace('class="card rc"','class="rc" style="border:0;padding:0"')}<div class="row" style="margin-top:10px"><button class="btn sm pr" data-go="/resource/${r.id}">Open</button><button class="btn sm" data-bm="${r.id}">Remove</button></div></div>`).join('')}</div>`:'<div class="empty">Nothing saved yet. Tap ☆ on any resource to keep it here.<br><br><button class="btn pr" data-go="/resources">Browse resources</button></div>'}`};
V.dashboard=()=>{const h=new Date().getHours(),n=(user&&user.name||'Gurvinder').split(' ')[0],sem=user&&user.sem||1,mine=SUB.filter(s=>s.sem==sem);const cont=[R[0],R.find(r=>r.title=='Relations & Functions — Lecture Notes'),R.find(r=>r.title=='CPU Organization Explained')];
return`<div style="padding-top:22px"><h2>Good ${h<12?'morning':h<17?'afternoon':'evening'}, ${n} 👋</h2><p class="sub" style="margin-bottom:14px">Ready to continue learning?</p><input class="inp" id="dq" placeholder="Search notes, topics, PYQs, assignments..."><div style="margin:10px 0 20px">${chips()}</div>
<div class="grid" style="margin-bottom:26px">${[['📚','My Subjects',mine.length+' subjects','/subjects'],['🕘','Recent Resources','Pick up where you left off','/resources'],['⭐','Bookmarks',bm.size+' saved','/bookmarks'],['❓','Previous-Year Questions',R.filter(r=>r.type=='PYQ').length+' papers','/search/'+encodeURIComponent('pyq')]].map(a=>`<div class="card" data-go="${a[3]}"><div class="ic">${a[0]}</div><h4>${a[1]}</h4><p>${a[2]}</p></div>`).join('')}</div>
<h3 style="margin-bottom:12px">Continue studying</h3><div class="grid">${cont.filter(Boolean).map(r=>`<div class="card" data-go="/resource/${r.id}"><p>${sub(r.s).name}</p><h4>${r.topic} — ${r.type}</h4><div class="prog"><i style="width:${40+r.t*12}%;background:${sub(r.s).c}"></i></div></div>`).join('')}</div>

V.pricing=()=>`<div style="text-align:center;padding:36px 0 20px"><h2>Simple pricing. Built for students.</h2><p class="sub" style="margin:8px auto">Start free. Upgrade when exams get serious.</p></div><div class="price"><div class="card"><h3>Free</h3><div class="big">₹0<small style="font-size:15px;font-weight:500;color:var(--mut)">/month</small></div><ul><li>Basic resource access</li><li>Subject browsing</li><li>Search</li><li>Limited bookmarks</li></ul><button class="btn" style="width:100%" data-go="/signup">Start Free</button></div><div class="card feat"><span class="bd t-PYQ">Most popular</span><h3>Student Plus</h3><div class="big">₹29<small style="font-size:15px;font-weight:500;color:var(--mut)">/month</small></div><ul><li>Unlimited resources</li><li>Advanced search</li><li>Unlimited bookmarks</li><li>Full PYQ library</li><li>Organized subject resources</li><li>Priority access to new resources</li></ul><button class="btn ye" style="width:100%" data-act="plus">Get Student Plus</button></div></div>`;
V.about=()=>`<div style="max-width:720px;padding:40px 0"><h2>Why Smart Academic Hub exists</h2><p class="lead">“Students shouldn't spend more time searching for study material than actually studying.”</p><h3 style="margin:22px 0 8px">Mission</h3><p class="sub">Smart Academic Hub makes academic resources easier to discover, organize and access — by semester, subject, topic and type.</p><h3 style="margin:22px 0 8px">Vision</h3><p class="sub"><b>A simpler academic experience for every student.</b></p><div class="row">${wa}<button class="btn pr" data-go="/signup">Get Started</button></div></div>`;
V.login=()=>`<div class="auth card"><h2>Welcome back</h2><p class="sub" style="margin-bottom:0">Log in to your Smart Academic Hub.</p><label>Email</label><input class="inp" id="em" type="email" placeholder="you@college.edu"><label>Password</label><input class="inp" id="pw" type="password"><label style="font-weight:400"><input type="checkbox" checked> Remember me</label><div class="row" style="margin-top:14px"><button class="btn pr" style="flex:1" data-act="login">Login</button></div><p style="margin-top:14px;font-size:13px"><a href="#" data-act="forgot" style="color:var(--b)">Forgot password?</a> · New here? <a href="#/signup" style="color:var(--b)">Sign up</a></p><p style="font-size:11px;color:var(--mut);margin-top:10px">Demo only: accounts are stored in this browser, no server.</p></div>`;
V.signup=()=>`<div class="auth card"><h2>Create your account</h2><label>Name</label><input class="inp" id="nm"><label>Email</label><input class="inp" id="em" type="email"><label>Password</label><input class="inp" id="pw" type="password" placeholder="Min 6 characters"><label>College</label><input class="inp" id="cl"><label>Course</label><select class="inp" id="co"><option>BTech Computer Science</option><option>BTech IT</option><option>BCA</option></select><label>Semester</label><select class="inp" id="se"><option value="1">Semester 1</option><option value="2">Semester 2</option></select><button class="btn pr" style="width:100%;margin-top:16px" data-act="signup">Create account</button><p style="margin-top:12px;font-size:13px">Have an account? <a href="#/login" style="color:var(--b)">Log in</a></p></div>`;
V.profile=()=>{if(!user)return V.login();return`${crumb([['Home','/'],['Profile']])}<h2>Profile & Settings</h2><div class="card" style="max-width:480px;margin-top:14px"><label>Name</label><input class="inp" id="nm" value="${user.name}"><label style="display:block;margin-top:10px">College</label><input class="inp" id="cl" value="${user.college||''}"><label style="display:block;margin-top:10px">Semester</label><select class="inp" id="se"><option value="1" ${user.sem==1?'selected':''}>Semester 1</option><option value="2" ${user.sem==2?'selected':''}>Semester 2</option></select><p style="margin:12px 0">Plan: <b>${plus?'Student Plus':'Free'}</b></p><div class="row"><button class="btn pr" data-act="save">Save</button><button class="btn" data-act="logout">Log out</button></div></div>`};
V.nf=()=>`<div class="empty" style="margin-top:40px"><h3>Page not found</h3><br><button class="btn pr" data-go="/">Go home</button></div>`;
function layout(){const p=location.hash.slice(2).split('/')[0]||'home',L=[['Home','/'],['Resources','/resources'],['Subjects','/subjects'],['Pricing','/pricing'],['About','/about']];
$('#links').innerHTML=L.map(l=>`<a href="#${l[1]}" class="${('/'+p)==l[1]||(p=='home'&&l[1]=='/')?'on':''}">${l[0]}</a>`).join('');
$('#auth').innerHTML=user?`<a class="btn sm hide-m" href="#/dashboard">Dashboard</a><a class="btn sm pr" href="#/profile">${user.name[0].toUpperCase()}</a>`:`<a class="btn sm hide-m" href="#/login">Log in</a><a class="btn sm pr" href="#/signup">Get Started</a>`;
$('#bn').innerHTML=[['🏠','Home','/'],['📚','Subjects','/subjects'],['🔍','Search','/resources'],['⭐','Saved','/bookmarks'],['👤',user?'Profile':'Login',user?'/profile':'/login']].map(a=>`<a href="#${a[2]}" class="${location.hash=='#'+a[2]||(a[2]=='/'&&!location.hash)?'on':''}"><b>${a[0]}</b>${a[1]}</a>`).join('')}
function render(){const [r,a,b]=location.hash.slice(2).split('/').map(decodeURIComponent);const m={'':'home',resources:'search',search:'search'}[r||''];let h;
const protectedR=['dashboard','bookmarks'];
if(r=='search'||r=='resources')h=V.search(r=='search'?a:'');else if(V[r||'home'])h=V[r||'home'](a,b);else h=V.nf();
$('#app').innerHTML=h;layout();scrollTo(0,0);document.title='Smart Academic Hub — Stop searching. Start studying.';
if($('#res'))paint($('#sq').value);}
document.addEventListener('click',e=>{const t=e.target.closest('[data-bm],[data-act],[data-go]');if(!t)return;const d=t.dataset;
if(d.bm){e.stopPropagation();const id=d.bm;if(bm.has(id)){bm.delete(id);toast('Bookmark removed')}else{if(!plus&&bm.size>=10)return toast('Free plan limit: 10 bookmarks. Upgrade to Student Plus.');bm.add(id);toast('Saved to bookmarks ★')}sv('bm',JSON.stringify([...bm]));const y=scrollY;render();scrollTo(0,y);return}
if(d.act){e.preventDefault();({open:()=>toast('Demo: no real file attached yet. Link your Drive here.'),dl:()=>toast('Demo: download disabled — sample data only.'),clr:()=>{F={};render()},plus:()=>{plus=true;sv('plus','1');toast('Student Plus activated (demo — no payment taken)')},forgot:()=>toast('Demo: password reset email would be sent.'),login:()=>{const em=$('#em').value.trim();if(!/^\S+@\S+\.\S+$/.test(em)||$('#pw').value.length<6)return toast('Enter a valid email and a 6+ character password.');user=user&&user.email==em?user:{name:em.split('@')[0],email:em,sem:1,college:''};sv('user',JSON.stringify(user));toast('Logged in');go('/dashboard')},signup:()=>{const em=$('#em').value.trim();if(!$('#nm').value.trim()||!/^\S+@\S+\.\S+$/.test(em)||$('#pw').value.length<6)return toast('Fill name, valid email and a 6+ character password.');user={name:$('#nm').value.trim(),email:em,college:$('#cl').value,course:$('#co').value,sem:+$('#se').value};sv('user',JSON.stringify(user));toast('Welcome to Smart Academic Hub!');go('/dashboard')},save:()=>{user.name=$('#nm').value||user.name;user.college=$('#cl').value;user.sem=+$('#se').value;sv('user',JSON.stringify(user));toast('Profile saved');layout()},logout:()=>{user=null;sv('user','null');toast('Logged out');go('/')}})[d.act]();return}
if(d.go)go(d.go)});
document.addEventListener('input',e=>{if(e.target.id=='sq')paint(e.target.value)});
document.addEventListener('change',e=>{const f=e.target.dataset.f;if(f){F[f]=e.target.value;paint($('#sq').value)}});
